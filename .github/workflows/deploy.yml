name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the approved portfolio
        shell: bash
        run: |
          mkdir -p site
          python3 - <<'PY'
          import json, pathlib, urllib.request
          base = "https://asmaa-magdy-portfolio-v21.yousefsamy2011.chatgpt.site/"
          root = pathlib.Path("site")
          for name in ("index.html", "asset-manifest.json"):
              urllib.request.urlretrieve(base + name, root / name)
          manifest = json.loads((root / "asset-manifest.json").read_text())
          for item in manifest["files"]:
              rel = item["file"]
              dest = root / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(base + rel, dest)
          (root / ".nojekyll").write_text("")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
